<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Promo feed 1080x1350</title>
<link rel="stylesheet" href="brand.css">
<style>
  html, body, .canvas { width: 1080px; height: 1350px; }

  .art { background-image: url('plates/feed.jpg'); background-position: center bottom; }
  .scrim {
    background:
      linear-gradient(180deg, rgba(10,15,26,0.96) 0%, rgba(10,15,26,0.94) 32%, rgba(10,15,26,0.55) 46%, rgba(10,15,26,0.00) 58%),
      linear-gradient(0deg,   rgba(10,15,26,0.90) 0%, rgba(10,15,26,0.40) 12%, rgba(10,15,26,0.00) 24%);
  }

  .content {
    position: absolute; inset: 0;
    padding: 76px 84px 72px;
    display: flex; flex-direction: column;
  }

  .top { display: flex; align-items: center; gap: 18px; }
  .top .icon { width: 68px; height: 68px; border-radius: 26%; display: block; }
  .top .name { font-size: 27px; font-weight: 700; letter-spacing: -0.01em; }

  .rule { width: 66px; height: 6px; margin: 58px 0 30px; }

  .eyebrow { font-size: 22px; }

  h1 {
    margin-top: 24px;
    font-size: 92px; font-weight: 800;
    line-height: 0.98; letter-spacing: -0.045em;
  }
  h1 em { font-style: normal; color: var(--orange-lite); }

  .sub {
    margin-top: 30px;
    font-size: 30px; font-weight: 500; line-height: 1.4;
    color: var(--muted); max-width: 620px;
  }

  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .cta { font-size: 30px; padding: 26px 46px; }
  .foot .handle { font-size: 25px; font-weight: 500; color: var(--dim); }
</style>
</head>
<body>
  <div class="canvas">
    <div class="art"></div>
    <div class="scrim"></div>

    <div class="content">
      <div class="top">
        <img class="icon" src="../../assets/icon.png" alt="">
        <span class="name">Lopen te Lopen</span>
      </div>

      <div class="rule"></div>
      <div class="eyebrow">Hardloopcoach</div>

      <h1>Jouw coach<br>naar de <em>finish</em>.</h1>

      <p class="sub">Schema's van 5 km en 10 km<br>tot de marathon.<br>Met coaching in je oor tijdens elke run.</p>

      <div class="foot">
        <span class="cta">Nu in de App Store</span>
        <span class="handle">@lopentelopen</span>
      </div>
    </div>
  </div>
</body>
</html>
