<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Store-screenshot (single / spread-helft)</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* De canvasafmetingen komen uit de config (?cfg=...) en worden in JS gezet.
     Eén layout voor enkele slides én panorama-helften: bij een spread tekent
     de pagina de dubbelbrede wereld en laat alleen de gevraagde helft zien. */
  html, body { background: var(--navy); }
  .canvas { background: var(--navy); }
  .art { background-image: url('plates/texture.jpg'); background-position: center; opacity: 0.30; }
  .scrim { background: linear-gradient(180deg, rgba(10,15,26,0.55) 0%, rgba(10,15,26,0.20) 45%, rgba(10,15,26,0.70) 100%); }

  .world { position: absolute; top: 0; left: 0; }       /* 1x of 2x canvasbreed */
  .rule { position: absolute; }
  .head { position: absolute; }
  h1 { font-weight: 800; line-height: 1.0; letter-spacing: -0.045em; }
  h1 em { font-style: normal; color: var(--orange-lite); }
  .sub { font-weight: 500; line-height: 1.34; color: var(--muted); }

  .phone {
    position: absolute;
    background: #05070d;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.13), 0 40px 90px rgba(0,0,0,0.60), 0 0 120px rgba(242,80,17,0.10);
    overflow: hidden;
  }
  .phone canvas { display: block; position: absolute; }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="art" id="art"></div>
  <div class="scrim" id="scrim"></div>
  <div class="world" id="world"></div>
</div>
<script>
const cfg = JSON.parse(new URLSearchParams(location.search).get('cfg'));
const { W, H, slide, src } = cfg;
const apple = cfg.format === 'apple';

// Maten per formaat: opnieuw opgemaakt, niet uitgerekt.
const M = apple
  ? { padX: 100, top: 170, ruleW: 96, ruleH: 9, h1: 124, sub: 46, gapRule: 46, gapSub: 30, stageTop: 690, bottom: 110, bezel: 9, radius: 92 }
  : { padX: 80,  top: 120, ruleW: 80, ruleH: 8, h1: 102, sub: 38, gapRule: 38, gapSub: 24, stageTop: 520, bottom: 90,  bezel: 8, radius: 76 };

const isSpread = slide.type === 'spread-left' || slide.type === 'spread-right';
const worldW = isSpread ? W * 2 : W;
const canvasEl = document.getElementById('canvas');
canvasEl.style.width = W + 'px'; canvasEl.style.height = H + 'px';
// Achtergrond en scrim lopen bij een spread door over de naad (twee breedtes, half zichtbaar).
for (const id of ['art', 'scrim']) {
  const el = document.getElementById(id);
  el.style.width = worldW + 'px'; el.style.height = H + 'px';
  if (slide.type === 'spread-right') el.style.left = (-W) + 'px';
}
const world = document.getElementById('world');
world.style.width = worldW + 'px'; world.style.height = H + 'px';
if (slide.type === 'spread-right') world.style.left = (-W) + 'px';

const loadImg = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('laden mislukt: ' + url)); i.src = url; });

function html(s) { return s.replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/\n/g, '<br>'); }

(async () => {
  // 1. Bron samenstellen (stitch) op native resolutie.
  const imgs = await Promise.all(src.parts.map((p) => loadImg(p.url)));
  const base = src.parts[0].offset + src.parts[0].top;
  const width = imgs[0].width;
  const total = Math.max(...src.parts.map((p) => p.offset + p.bottom)) - base;
  const pano = document.createElement('canvas'); pano.width = width; pano.height = total;
  const pc = pano.getContext('2d');
  pc.fillStyle = '#0A0F1A'; pc.fillRect(0, 0, width, total);
  src.parts.forEach((p, i) => {
    pc.drawImage(imgs[i], 0, p.top, width, p.bottom - p.top, 0, p.offset + p.top - base, width, p.bottom - p.top);
  });

  // 2. Vaste telefoonmaat (Apple/Play elk één vaste schermverhouding). De bron wordt een
  //    uitsnede: venster = breedte / verhouding rijen hoog, beginnend bij winTop (px in het
  //    samengestelde beeld; 'end' = onderkant van de bron). Spread-rechts begint standaard
  //    direct onder het linkervenster (doorlopend); een eigen winTop onderbreekt dat bewust.
  const winH = width / cfg.phoneAspect;
  const topOf = (s, def) => (s && s.winTop === 'end') ? Math.max(0, total - winH) : (s && typeof s.winTop === 'number') ? s.winTop : def;
  let wins;
  if (isSpread) {
    const tl = topOf(cfg.leftSlide, 0);
    wins = [[tl, tl + winH], [topOf(cfg.rightSlide, tl + winH), 0]];
    wins[1][1] = wins[1][0] + winH;
  } else wins = [[topOf(slide, 0), topOf(slide, 0) + winH]];

  // 3. Tekstkoppen. Elke helft/slide krijgt eigen kop; de streep loopt over de naad.
  const halves = isSpread ? 2 : 1;
  const heads = isSpread ? [cfg.leftSlide, cfg.rightSlide] : [slide];
  for (let h = 0; h < halves; h++) {
    const head = document.createElement('div');
    head.className = 'head';
    head.style.left = (h * W + M.padX) + 'px'; head.style.top = (M.top + M.ruleH + M.gapRule) + 'px';
    head.style.width = (W - 2 * M.padX) + 'px';
    head.innerHTML = `<h1 style="font-size:${M.h1}px">${html(heads[h].kop)}</h1>` +
      (heads[h].sub ? `<p class="sub" style="font-size:${M.sub}px;margin-top:${M.gapSub}px">${html(heads[h].sub)}</p>` : '');
    world.appendChild(head);
  }
  // Streep: single = korte merkstreep; spread = één doorlopende streep over de naad.
  const rule = document.createElement('div');
  rule.className = 'rule';
  rule.style.top = M.top + 'px'; rule.style.height = M.ruleH + 'px';
  rule.style.left = M.padX + 'px';
  rule.style.width = (isSpread ? W + M.ruleW : M.ruleW) + 'px';
  world.appendChild(rule);

  // 4. Telefoons.
  const stageH = H - M.stageTop - M.bottom;
  const availW = W - 2 * M.padX - 2 * M.bezel;
  const availH = stageH - 2 * M.bezel;
  const sh = availH;                                   // vast per formaat
  const sw = Math.round(sh * cfg.phoneAspect);         // vaste breedte, nooit smaller
  const scale = sw / width;
  const pw = sw + 2 * M.bezel, ph = sh + 2 * M.bezel;
  wins.forEach((w, h) => {
    const phone = document.createElement('div');
    phone.className = 'phone';
    phone.style.width = pw + 'px'; phone.style.height = ph + 'px';
    phone.style.left = (h * W + Math.round((W - pw) / 2)) + 'px';
    phone.style.top = (M.stageTop + Math.max(0, Math.round((stageH - ph) / 2))) + 'px';
    phone.style.borderRadius = M.radius + 'px';
    const c = document.createElement('canvas');
    c.width = sw; c.height = sh;
    c.style.left = M.bezel + 'px'; c.style.top = M.bezel + 'px';
    const cx = c.getContext('2d');
    cx.fillStyle = '#0A0F1A'; cx.fillRect(0, 0, sw, sh);
    cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
    const y0 = Math.max(0, w[0]), y1 = Math.min(total, w[1]);   // buiten de bron blijft het appachtergrond
    if (y1 > y0) cx.drawImage(pano, 0, y0, width, y1 - y0, 0, (y0 - w[0]) * scale, sw, (y1 - y0) * scale);
    phone.appendChild(c);
    world.appendChild(phone);
  });
})().catch((e) => { document.body.innerHTML = '<pre style="color:red;font-size:30px">' + e.message + '</pre>'; });
</script>
</body>
</html>
