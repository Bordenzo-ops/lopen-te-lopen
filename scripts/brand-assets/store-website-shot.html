<!doctype html>
<html><head><meta charset="utf-8"><title>Website-schermbeeld (JPEG-export)</title></head>
<body style="margin:0;background:#0A0F1A">
<!-- Tekent een bronbeeld (evt. gestitcht) op breedte cfg.width en schrijft een JPEG-dataURL
     in <pre id="out">; render.mjs leest die uit via --dump-dom en schrijft het bestand. -->
<pre id="out"></pre>
<script>
const cfg = JSON.parse(new URLSearchParams(location.search).get('cfg'));
const { src, width, height, quality } = cfg;
const loadImg = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('laden mislukt: ' + url)); i.src = url; });
(async () => {
  const imgs = await Promise.all(src.parts.map((p) => loadImg(p.url)));
  const base = src.parts[0].offset + src.parts[0].top;
  const w0 = imgs[0].width;
  const total = Math.max(...src.parts.map((p) => p.offset + p.bottom)) - base;
  const pano = document.createElement('canvas'); pano.width = w0; pano.height = total;
  const pc = pano.getContext('2d'); pc.fillStyle = '#0A0F1A'; pc.fillRect(0, 0, w0, total);
  src.parts.forEach((p, i) => pc.drawImage(imgs[i], 0, p.top, w0, p.bottom - p.top, 0, p.offset + p.top - base, w0, p.bottom - p.top));
  const scale = width / w0;
  const c = document.createElement('canvas'); c.width = width; c.height = height;
  const cx = c.getContext('2d'); cx.fillStyle = '#0A0F1A'; cx.fillRect(0, 0, width, height);
  cx.imageSmoothingQuality = 'high';
  const srcH = Math.min(total, height / scale);
  cx.drawImage(pano, 0, 0, w0, srcH, 0, 0, width, srcH * scale);
  document.getElementById('out').textContent = c.toDataURL('image/jpeg', quality);
})().catch((e) => { document.getElementById('out').textContent = 'ERROR ' + e.message; });
</script></body></html>
