<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Deelkaart story 1080x1920</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Dit is 3x de maat waarop SharePeriodCard in de app rendert (360x640),
     zodat dit bestand 1-op-1 als ontwerpreferentie dient: deel elke waarde
     hier door 3 om bij de React Native-styles uit te komen. */
  html, body, .canvas { width: 1080px; height: 1920px; }

  .art { background-image: url('plates/vert.jpg'); background-position: center bottom; }

  /* Donker naar boven én naar onder: boven voor de statistiek,
     onder zodat de merkbalk over de schoen heen leesbaar blijft. */
  .scrim {
    background:
      linear-gradient(180deg, rgba(10,15,26,0.97) 0%, rgba(10,15,26,0.90) 38%, rgba(10,15,26,0.30) 58%, rgba(10,15,26,0.00) 70%),
      linear-gradient(0deg,   rgba(10,15,26,0.95) 0%, rgba(10,15,26,0.55) 9%, rgba(10,15,26,0.00) 22%);
  }

  .content {
    position: absolute; inset: 0;
    padding: 84px 78px 72px;
    display: flex; flex-direction: column;
  }

  /* ── Kop: merk links, loper rechts ── */
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top .lockup { display: flex; align-items: center; gap: 16px; }
  .top .icon { width: 60px; height: 60px; border-radius: 26%; display: block; }
  .top .name { font-size: 22px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .top .runner { font-size: 26px; font-weight: 600; color: var(--muted); }

  /* ── Periode + vergelijking ── */
  .period { margin-top: 78px; font-size: 34px; letter-spacing: 0.2em; }
  .delta  { margin-top: 26px; font-size: 26px; padding: 15px 28px; }

  /* ── Hero-stat ── */
  .heroRow { margin-top: 40px; display: flex; align-items: baseline; gap: 18px; }
  .hero    { font-size: 288px; }
  .heroUnit { font-size: 64px; font-weight: 700; color: var(--muted); letter-spacing: -0.02em; }

  .hair { height: 3px; margin: 44px 0 0; border-radius: 2px; }

  /* ── Statistiekraster ── */
  .stats { margin-top: 44px; display: grid; grid-template-columns: repeat(3, 1fr); row-gap: 44px; }
  .stat .label { font-size: 20px; }
  .stat .value { margin-top: 12px; font-size: 52px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .stat .value small { font-size: 26px; font-weight: 500; color: var(--dim); margin-left: 6px; letter-spacing: 0; }

  /* ── Merkbalk onderaan: dit maakt de kaart tot uithangbord ── */
  .brandbar { margin-top: auto; align-items: baseline; gap: 16px; }
  .brandbar .name   { font-size: 30px; letter-spacing: -0.01em; }
  .brandbar .sep    { width: 5px; height: 5px; border-radius: 999px; background: var(--orange); align-self: center; }
  .brandbar .handle { font-size: 27px; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="art"></div>
    <div class="scrim"></div>

    <div class="content">
      <div class="top">
        <div class="lockup">
          <img class="icon" src="../../assets/icon.png" alt="">
          <span class="name">Lopen te Lopen</span>
        </div>
        <span class="runner">Anne</span>
      </div>

      <div class="period eyebrow">Week 29</div>
      <div><span class="delta pill">+18% t.o.v. vorige week</span></div>

      <div class="heroRow">
        <span class="hero">6.6</span>
        <span class="heroUnit">km</span>
      </div>

      <div class="hair"></div>

      <div class="stats">
        <div class="stat"><div class="label">Runs</div>          <div class="value">1</div></div>
        <div class="stat"><div class="label">Tijd</div>          <div class="value">38:18</div></div>
        <div class="stat"><div class="label">Gem. tempo</div>    <div class="value">5:47<small>/km</small></div></div>
        <div class="stat"><div class="label">Langste run</div>   <div class="value">6.6<small>km</small></div></div>
        <div class="stat"><div class="label">Beste tempo</div>   <div class="value">5:47<small>/km</small></div></div>
        <div class="stat"><div class="label">Actieve dagen</div> <div class="value">1</div></div>
      </div>

      <div class="brandbar">
        <span class="name">Lopen te Lopen</span>
        <i class="sep"></i>
        <span class="handle">@lopentelopen</span>
      </div>
    </div>
  </div>
</body>
</html>
